<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>For Papa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e231d;--bg2:#143229;--ivory:#efe8d6;--brass:#b99a5b;--paper:#f5f0e3;--ink:#2a2a26}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:radial-gradient(ellipse at top,var(--bg2),var(--bg) 70%) fixed;color:var(--ivory);font-family:'Jost',sans-serif;font-weight:300;min-height:100vh;line-height:1.6}
h1,h2,.serif{font-family:'Cormorant Garamond',serif;font-weight:400}
section{min-height:100vh;display:none;flex-direction:column;align-items:center;justify-content:center;padding:48px 20px;text-align:center}
section.on{display:flex}
h1{font-size:clamp(3rem,10vw,6.5rem);line-height:1;letter-spacing:.01em}
h2{font-size:clamp(1.8rem,5vw,2.8rem);margin-bottom:8px}
p.sub{color:#b9c4bb;max-width:34ch;margin:18px auto 0;font-size:1rem}
button,.btn{font:inherit;font-weight:400;letter-spacing:.12em;font-size:.82rem;text-transform:lowercase;color:var(--ivory);background:none;border:1px solid var(--brass);padding:13px 34px;cursor:pointer;margin-top:30px;transition:background .3s,color .3s}
button:hover,button:focus-visible{background:var(--brass);color:var(--bg);outline:none}
.rule{width:44px;height:1px;background:var(--brass);margin:22px auto}
.step{color:var(--brass);font-size:.8rem;letter-spacing:.2em;margin-bottom:22px}
/* tic tac toe */
#board{display:grid;grid-template-columns:repeat(3,92px);gap:8px;margin:26px 0 6px}
#board button{width:92px;height:92px;margin:0;padding:0;font-family:'Cormorant Garamond',serif;font-size:2.8rem;letter-spacing:0;border-color:#3d5a4d}
#board button:disabled{cursor:default;color:var(--ivory)}
#board button.o{color:var(--brass)}
#msg{min-height:1.6em;color:#b9c4bb}
/* quiz */
.opts{display:grid;gap:10px;width:min(420px,100%);margin-top:24px}
.opts button{margin:0;text-align:left;padding:14px 20px;letter-spacing:.04em;font-size:.95rem;text-transform:none;border-color:#3d5a4d}
.opts button.bad{border-color:#a2574d;color:#d9a79f}
.opts button.good{background:var(--brass);color:var(--bg)}
/* passcode */
input{font:inherit;font-family:'Cormorant Garamond',serif;font-size:1.8rem;letter-spacing:.3em;text-align:center;background:none;border:0;border-bottom:1px solid var(--brass);color:var(--ivory);padding:8px;width:min(300px,100%);margin-top:26px}
input:focus{outline:none;border-color:var(--ivory)}
.hint{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.3rem;color:var(--brass);margin-top:20px}
.shake{animation:sh .4s}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
/* gallery */
#gallery{display:none;padding:90px 20px 40px}
#gallery.on{display:block}
.gh{text-align:center;margin-bottom:70px}
.col{display:flex;flex-direction:column;align-items:center;gap:90px}
.pol{background:var(--paper);padding:14px 14px 60px;width:min(380px,88vw);box-shadow:0 22px 40px -12px rgba(0,0,0,.6);position:relative;transform:rotate(var(--r))}
.pol::before{content:"";position:absolute;top:-14px;left:50%;width:90px;height:26px;margin-left:-45px;background:rgba(185,154,91,.55);transform:rotate(-2deg)}
.pol .ph{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;object-position:center 22%;background:#cfc8b6;filter:sepia(.8) brightness(1.25) contrast(.8);transition:filter 2.2s ease}
.pol.dev .ph{filter:none}
.pol figcaption{position:absolute;left:0;right:0;bottom:16px;text-align:center;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.3rem;color:var(--ink)}
.end{text-align:center;margin:90px 0 40px}
#letter{display:none;max-width:560px;margin:30px auto 100px;background:var(--paper);color:var(--ink);padding:56px 44px;box-shadow:0 22px 40px -12px rgba(0,0,0,.6);text-align:left}
#letter.on{display:block;animation:rise 1.1s ease both}
@keyframes rise{from{opacity:0;transform:translateY(30px)}}
#letter h3{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:1.9rem;margin-bottom:20px}
#letter p{font-family:'Cormorant Garamond',serif;font-size:1.3rem;line-height:1.75;margin-bottom:14px;white-space:pre-line}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
</style>
</head>
<body>

<!-- INTRO -->
<section id="s0" class="on">
  <p class="step">a small something</p>
  <h1 id="title"></h1>
  <div class="rule"></div>
  <p class="sub">Three little puzzles stand between you and your present.</p>
  <button onclick="go(1)">begin</button>
</section>

<!-- PUZZLE 1 -->
<section id="s1">
  <p class="step">first puzzle</p>
  <h2>Beat me at Tic Tac Toe</h2>
  <p class="sub">You are X, CAN YOU BEAT IT??????</p>
  <div id="board"></div>
  <p id="msg"></p>
</section>

<!-- PUZZLE 2 -->
<section id="s2">
  <p class="step">second puzzle</p>
  <h2 id="q"></h2>
  <div class="opts" id="opts"></div>
  <p id="qmsg" class="sub"></p>
</section>

<!-- PUZZLE 3 -->
<section id="s3">
  <p class="step">last puzzle</p>
  <h2>The passcode</h2>
  <p class="hint" id="hint"></p>
  <input id="code" type="text" autocomplete="off" aria-label="passcode">
  <button id="unlock">unlock</button>
  <p id="cmsg" class="sub"></p>
</section>

<!-- GALLERY -->
<main id="gallery">
  <div class="gh">
    <h2>Moments, kept.</h2>
    <div class="rule"></div>
  </div>
  <div class="col" id="col"></div>
  <div class="end">
    <button id="reveal">click me</button>
  </div>
  <article id="letter"></article>
</main>

<script>
/* ============ EDIT YOUR CONTENT HERE ============ */
const CONFIG = {
  title: "Happy Birthday, Papaaaa",
  passcode: "80",                 // the secret code
  hint: "DOB + Age",
  // Quiz: 3 questions. answer = index of the correct option (0 = first)
  quiz: [
    {q:"Whats your first gift this time?", options:["Meta","T-shirt","Me(YOUR SON)","Masala Tea"], answer:2},
    {q:"Your First Job?", options:["KV Teacher","CEO","Sr.VP ","MD"], answer:0},
    {q:"Fav Food?", options:["Paneer Butter Masala","Dal Chawal","Sweet Corn","Sourdough Pizza"], answer:1}
  ],
  // 14 photos: put them in /images named 1.jpg ... 14.jpg
  captions: ["","","","","","","","","","","","","",""],
  letterTitle: "Dear Papa,",
  letter: "Dear Papa,\n\n You are now becoming 51, and like u hear a lot....aging like fine wine. \n\n There isnt a reason for every birthday to be special but...but there is a reason everyday is special\n\n and tht reason is you, Our whole family depends on your support and infamous scolsings\n\n To be honest you are my biggest role model, trust me or not...It isnt a one day or a one week realisation, but in some way \n\n or the other I seem to be a DNA copy of you in ways that i never expected and this is told by others too\n\n The main point is 'AGE IS JUST A NUMBER' and today is your birthday, i really wish you the best happy birthday and live longer to propser larger\n\n Enjoy this day and every other day to come like never before, and remember papa - THE SECRET TO LIFE IS HAPPINESS, so keep smiling also be proud of what a great man you are today",
  letterSign: "With love Omi and family"
};
/* ================================================= */

const $ = id => document.getElementById(id);
const go = n => {
  document.querySelectorAll('section').forEach(s => s.classList.remove('on'));
  if (n < 4) { $('s'+n).classList.add('on'); window.scrollTo(0,0); }
  else { $('gallery').classList.add('on'); window.scrollTo(0,0); }
};
$('title').textContent = CONFIG.title;
document.title = CONFIG.title;

/* ---- Puzzle 1: tic tac toe ---- */
const L = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
let b, over;
const win = (s,p) => L.some(l => l.every(i => s[i] === p));
const free = s => s.map((v,i) => v ? null : i).filter(v => v !== null);
function mm(s, p){ // minimax from AI (O) perspective
  if (win(s,'O')) return 1; if (win(s,'X')) return -1;
  const f = free(s); if (!f.length) return 0;
  const sc = f.map(i => { s[i] = p; const v = mm(s, p === 'O' ? 'X' : 'O'); s[i] = null; return v; });
  return p === 'O' ? Math.max(...sc) : Math.min(...sc);
}
function aiMove(){
  const f = free(b);
  if (Math.random() < 0.3) return f[Math.floor(Math.random()*f.length)]; // keeps it beatable
  let best = -2, mv = f[0];
  f.forEach(i => { b[i] = 'O'; const v = mm(b,'X'); b[i] = null; if (v > best){ best = v; mv = i; } });
  return mv;
}
function draw(){
  document.querySelectorAll('#board button').forEach((c,i) => {
    c.textContent = b[i] || ''; c.className = b[i] === 'O' ? 'o' : ''; c.disabled = over || !!b[i];
  });
}
function reset(m){ b = Array(9).fill(null); over = false; $('msg').textContent = m || 'Your move.'; draw(); }
function end(m){ over = true; draw(); $('msg').textContent = m; }
function play(i){
  if (over || b[i]) return;
  b[i] = 'X';
  if (win(b,'X')){ end('Well played.'); setTimeout(() => go(2), 1300); return; }
  if (!free(b).length){ end('A draw. Again.'); setTimeout(() => reset('Your move.'), 1400); return; }
  b[aiMove()] = 'O';
  if (win(b,'O')){ end('Mine this time. Again.'); setTimeout(() => reset('Your move.'), 1400); return; }
  if (!free(b).length){ end('A draw. Again.'); setTimeout(() => reset('Your move.'), 1400); return; }
  draw();
}
for (let i = 0; i < 9; i++){ const c = document.createElement('button'); c.onclick = () => play(i); $('board').appendChild(c); }
reset();

/* ---- Puzzle 2: quiz ---- */
let qi = 0;
function showQ(){
  const item = CONFIG.quiz[qi];
  $('q').textContent = item.q; $('qmsg').textContent = `Question ${qi+1} of ${CONFIG.quiz.length}`;
  $('opts').innerHTML = '';
  item.options.forEach((o,i) => {
    const bt = document.createElement('button'); bt.textContent = o;
    bt.onclick = () => {
      if (i === item.answer){
        bt.className = 'good';
        setTimeout(() => { qi++; qi < CONFIG.quiz.length ? showQ() : go(3); }, 700);
      } else { bt.className = 'bad'; $('qmsg').textContent = 'Not quite. Try another.'; }
    };
    $('opts').appendChild(bt);
  });
}
showQ();

/* ---- Puzzle 3: passcode ---- */
$('hint').textContent = CONFIG.hint;
function tryCode(){
  if ($('code').value.trim().toLowerCase() === CONFIG.passcode.toLowerCase()){ go(4); startGallery(); }
  else { $('cmsg').textContent = 'That is not it.'; $('code').classList.remove('shake'); void $('code').offsetWidth; $('code').classList.add('shake'); }
}
$('unlock').onclick = tryCode;
$('code').addEventListener('keydown', e => { if (e.key === 'Enter') tryCode(); });

/* ---- Gallery ---- */
let built = false;
function startGallery(){
  if (built) return; built = true;
  const rot = [-3,2.5,-1.5,3,-2.5,1.5,-3.5];
  for (let i = 1; i <= 14; i++){
    const f = document.createElement('figure'); f.className = 'pol';
    f.style.setProperty('--r', rot[(i-1) % rot.length] + 'deg');
    f.innerHTML = `<img class="ph" alt="" src="images/${i}.jpg" onerror="if(!this.dataset.t){this.dataset.t=1;this.src='${i}.jpg'}"><figcaption>${CONFIG.captions[i-1] || ''}</figcaption>`;
    $('col').appendChild(f);
  }
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting){ e.target.classList.add('dev'); io.unobserve(e.target); } }), {threshold:.35});
  document.querySelectorAll('.pol').forEach(p => io.observe(p));
}

/* ---- Letter ---- */
$('reveal').onclick = () => {
  const paras = CONFIG.letter.split('\n\n').map(t => `<p>${t}</p>`).join('');
  $('letter').innerHTML = `<h3>${CONFIG.letterTitle}</h3>${paras}<p><em>${CONFIG.letterSign}</em></p>`;
  $('letter').classList.add('on');
  $('reveal').style.display = 'none';
  setTimeout(() => $('letter').scrollIntoView({behavior:'smooth', block:'start'}), 150);
};
</script>
</body>
</html>
